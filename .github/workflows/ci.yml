name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}

    permissions:
      contents: read

    concurrency:
      group: staging-deployment
      cancel-in-progress: false

    steps:
      - name: Trigger Render staging deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Staging deployment hook is not configured."
            exit 1
          fi

          curl --fail --silent --show-error \
            --output /dev/null \
            --request POST "$DEPLOY_HOOK"

          echo "Staging deployment requested."
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Tests use mongodb-memory-server (see tests/helpers/db.js) and
    # tests/setup-env.js sets placeholder MONGODB_URI / JWT_SECRET values.
    # No secrets or real database connection strings are provided here.
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run Jest with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
